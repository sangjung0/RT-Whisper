name: RTWhisper-Dev
services:
    dev:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        environment:
            USER: ${CONTAINER_USER}
            UID: ${CONTAINER_UID}
            HOME: ${CONTAINER_HOME}
            WORKDIR: ${WORKDIR}
        volumes:
            - ../:${WORKDIR}
            - venv:${WORKDIR}/.venv
            - vendor:${WORKDIR}/.vendor
            - uv_cache:${CONTAINER_HOME}/.cache/uv
            - local_cache:${CONTAINER_HOME}/.local

            - huggingface_cache:${CONTAINER_HOME}/.cache/huggingface
            - torch_cache:${CONTAINER_HOME}/.cache/torch
            - fasttext_cache:${CONTAINER_HOME}/.cache/fasttext
            - whisper_cache:${CONTAINER_HOME}/.cache/whisper

            # dataset
            - datasets:${WORKDIR}/.datasets:ro
            - datasets_asr_rankformer_datasets:${WORKDIR}/.datasets/asr-rankformer-datasets:rw
            - datasets_ami:${WORKDIR}/.datasets/ami:rw
            - datasets_tedlium:${WORKDIR}/.datasets/tedlium:rw
            - datasets_vox_populi:${WORKDIR}/.datasets/vox_populi:rw
            - datasets_libri_speech:${WORKDIR}/.datasets/libri_speech:rw

            # storage
            - storage_rt_whisper:${WORKDIR}/.storage:rw
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        command: ["tail", "-f", "/dev/null"]

volumes:
    venv:
      driver: local
    vendor:
      driver: local
    uv_cache:
      driver: local
    local_cache:
      driver: local
    huggingface_cache:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/cache/huggingface
    torch_cache:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/cache/torch
    fasttext_cache:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/cache/fasttext
    whisper_cache:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/cache/whisper
    datasets:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/datasets
    datasets_asr_rankformer_datasets:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/datasets/asr-rankformer-datasets
    datasets_ami:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/datasets/ami
    datasets_tedlium:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/datasets/tedlium
    datasets_vox_populi:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/datasets/vox_populi
    datasets_libri_speech:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/datasets/libri_speech
    storage_rt_whisper:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${DOCKER_VOLUME}/storage/rt-whisper

