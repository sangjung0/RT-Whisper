name: RTWhisper-Dev
services:
    dev:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        volumes:
            - ../:/workspaces/dev

            #   - ../.model/huggingface:/root/.cache/huggingface
            - F:/Models/huggingface:/root/.cache/huggingface
            #   - ../.model/torch:/root/.cache/torch
            - F:/Models/torch:/root/.cache/torch

            - C:/Env/python/RTWhisper-Dev:/workspaces/dev/.venv
            # - /workspaces/dev/.venv # no cache

            # dataset
            - F:/Datasets:/workspaces/dev/datasets:ro
            - F:/Datasets/asr-rankformer-datasets:/workspaces/dev/datasets/asr-rankformer-datasets:rw
            - F:/Models/storage/rt-whisper:/workspaces/dev/storage:rw
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        command: ["tail", "-f", "/dev/null"]
