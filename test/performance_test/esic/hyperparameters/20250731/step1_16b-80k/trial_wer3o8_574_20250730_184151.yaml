metadata:
  description: ' 20250728 기점으로 수정된 RT Whisper 알고리즘을 사용함 saver_loader을 사용하여 측정되었으며,
    prompt는 사용하지 않음 배치 16 학습 횟수 3000으로 제한

    20250730/step1_16b 에서 이어지는 실험 RTX3090 GPU에서 최적화

    study: 20250731_step2_16b-80k.pkl

    (시작, 끝, 스탭)

    - max_overlap_duration: 80000

    - boundary: 0, 4800, 160

    - df_min_dur: 160

    - min_prob: 0, 1, 0.01

    - iou_threshold: 0, 1, 0.01

    - cos_threshold: 0, 1, 0.01

    - padding: 0, 960, 160 '
