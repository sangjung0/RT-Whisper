metadata:
  description: ' 20250731 기점으로 수정된 RT Whisper 알고리즘을 사용함 saver_loader을 사용하여 측정되었으며,
    prompt는 사용하지 않음

    배치 16 학습 횟수 6000으로 제한

    study: 20250804_step1_16b-112k.pkl

    (시작, 끝, 스탭)

    - max_overlap_duration: 112000

    - boundary: 0, 76000, 160

    - df_min_dur: 0, 8000, 160

    - min_prob: 0, 1, 0.01

    - iou_threshold: 0, 1, 0.01

    - cos_threshold: 0, 1, 0.01

    - padding: 0, 16000, 160 '
  generated_date:
    year: 2025
    month: 8
    day: 4
    hour: 9
    minute: 1
    second: 18
    microsecond: 380377
