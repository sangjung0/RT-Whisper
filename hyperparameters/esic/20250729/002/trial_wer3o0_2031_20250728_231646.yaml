metadata:
  description: ' 20250728 기점으로 수정된 RT Whisper 알고리즘을 사용함

    saver_loader을 사용하여 측정되었으며, prompt는 사용하지 않음

    배치 8

    학습 횟수 6000으로 제한

    20250728/001.yaml 결과를 기반으로 조정

    study: 20250729_study_8_batch_96k.pkl

    (시작, 끝, 스탭)

    - max_overlap_duration: 96000

    - boundary: 0, 4800, 160

    - df_min_dur: 0, 960, 160

    - min_prob: 0.1, 0.7, 0.01

    - iou_threshold: 0, 0.35, 0.01

    - cos_threshold: 0, 0.9, 0.01

    - padding: 0, 1440, 160 '
  generated_date:
    year: 2025
    month: 7
    day: 28
    hour: 23
    minute: 16
    second: 47
    microsecond: 7562
