    20250722 기점으로 수정된 RT Whisper 알고리즘을 사용함

    saver_loader을 사용하여 측정되었으며, prompt는 사용하지 않음

    배치 16

    20250722/004 결과 기반 하이퍼파라미터 탐색 범위를 좁힘

    학습 횟수 2000으로 제한


    (시작, 끝, 스탭)

    - max_overlap_duration: 96000

    - boundary: 5280, 14880, 160

    - df_min_dur: 800

    - min_prob: 0.2, 0.33, 0.01

    - iou_threshold: 0.1, 0.2, 0.01

    - cos_threshold: 0.6, 0.7, 0.01

    - padding: 320


    '
