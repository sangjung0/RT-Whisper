    20250725 기점으로 수정된 RT Whisper 알고리즘을 사용함

    saver_loader을 사용하여 측정되었으며, prompt는 사용하지 않음

    배치 16

    학습 횟수 3000으로 제한


    20250726/96000 기반으로 수정


    study: 20250727_study_16_batch-96.pkl


    (시작, 끝, 스탭)

    - max_overlap_duration: 96000

    - boundary: 2400, 15680, 160

    - df_min_dur: 160

    - min_prob: 0.2, 0.6, 0.01

    - iou_threshold: 0.08, 0.29, 0.01

    - cos_threshold: 0.5, 0.8, 0.01

    - padding: 0


    '
